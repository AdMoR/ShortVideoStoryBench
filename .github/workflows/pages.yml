# Build the public site and publish it to GitHub Pages.
#
# The site is three static pages rendered from what is already in the repository —
# the dataset for the atlas, `site/data/runs.json` for the performance page. There is
# no generation and no judging here: a benchmark run needs a GPU and hours, and its
# numbers are committed as a snapshot instead (`make site-data`). So this job is a few
# seconds of Python, and the only thing that can fail it is a dataset that no longer
# loads — which is the thing worth being told about anyway.
#
# One-time setup on the repository: Settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [master]
    paths:
      - dataset/**
      - site/**
      - video_eval_bench/report/**
      - video_eval_bench/dataset/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once, and never cancel one half-done: a cancelled deploy can
# leave the site on a partial upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync the environment from uv.lock
        run: uv sync --frozen

      # The dataset is validated on load — an unknown criterion id, a broken bind or
      # a tag outside the vocabulary fails here, before anything is published.
      - name: Build the site
        run: uv run python -m video_eval_bench.report.site build --out _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
