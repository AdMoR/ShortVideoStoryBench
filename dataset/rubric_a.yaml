# Section A — Universal Technical Baseline (10 points, applied to every video)
section: A
title: Universal Technical Baseline
criteria:
  - id: U1
    name: Identity Consistency
    description: >
      The main subject remains visually identical across scenes (face, hair,
      clothing, build). Any noticeable change is a failure.
    weight: 3
    critical: true
  - id: U2
    name: Temporal Stability
    description: >
      No flickering, morphing, or melting between frames. Objects and the
      subject must persist stably over time.
    weight: 3
    critical: true
  - id: U3
    name: Artifact Absence
    description: >
      No visual glitches: extra or missing limbs, broken or garbled text,
      smearing, duplicated textures, clipping.
    weight: 4
    critical: true
