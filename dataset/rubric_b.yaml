# Section B — Semantic & Cultural Fidelity (applied to every video)
# Focus: does the video respect real-world facts, history, geography, cultural
# symbols — and the reference images the brief supplied?
# The section is scored as a percentage of its own total weight, so this file
# does not have to sum to any particular number.
section: B
title: Semantic & Cultural Fidelity
criteria:
  - id: S1
    name: Geographical Accuracy
    description: >
      Landmarks (e.g. Pyramids of Giza, Eiffel Tower) have the correct number
      of structures, shape, and relative positioning.
    weight: 3
    critical: true
  - id: S2
    name: Historical/Period Accuracy
    description: >
      Clothing, technology, and architecture match the specified time period
      (e.g. no smartphones in the 1920s).
    weight: 3
    critical: true
  - id: S3
    name: Cultural Symbolism
    description: >
      Cultural symbols (flags, religious icons, traditional dress) are rendered
      correctly and respectfully — no inverted flags, no wrong colors.
    weight: 2
    critical: false
  - id: S4
    name: Biological/Anatomical Facts
    description: >
      Animals and humans have the correct number of limbs, wings, or
      anatomical features for their species.
    weight: 2
    critical: true
  - id: S5
    name: Reference Adherence
    description: >
      Every subject, location, prop or style the brief supplied a reference image
      for is recognisably the same one in the video: the same face, the same
      garment and colour, the same place, the same object, the same look. Judge
      against the reference images shown before the clip's frames, not against
      the wording of the prompt. A subject that drifts between frames fails this
      even if each individual frame resembles the reference.
    weight: 3
    critical: true
    # Only meaningful for a seed that carries references; the judge passes it
    # without a model call for one that does not, rather than skipping it — a
    # skipped criterion would cost the seed weight it had no way to earn.
    requires_references: true
