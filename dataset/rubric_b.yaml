# Section B — Semantic & Cultural Fidelity (10 points, applied to every video)
# Focus: does the video respect real-world facts, history, geography, cultural symbols?
section: B
title: Semantic & Cultural Fidelity
criteria:
  - id: S1
    name: Geographical Accuracy
    description: >
      Landmarks (e.g. Pyramids of Giza, Eiffel Tower) have the correct number
      of structures, shape, and relative positioning.
    weight: 3
    critical: true
  - id: S2
    name: Historical/Period Accuracy
    description: >
      Clothing, technology, and architecture match the specified time period
      (e.g. no smartphones in the 1920s).
    weight: 3
    critical: true
  - id: S3
    name: Cultural Symbolism
    description: >
      Cultural symbols (flags, religious icons, traditional dress) are rendered
      correctly and respectfully — no inverted flags, no wrong colors.
    weight: 2
    critical: false
  - id: S4
    name: Biological/Anatomical Facts
    description: >
      Animals and humans have the correct number of limbs, wings, or
      anatomical features for their species.
    weight: 2
    critical: true
