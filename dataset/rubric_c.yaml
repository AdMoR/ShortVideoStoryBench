# Section C — Genre-Specific Criteria (80 points each)
# One rubric per genre; the seed's category selects which one applies.

genres:
  - key: entertainment
    name: Entertainment & Storytelling
    focus: Narrative and emotional impact.
    criteria:
      - id: E1
        name: Scene Sequence
        description: Scenes appear in the exact order specified.
        weight: 10
        critical: true
      - id: E2
        name: Action Continuity
        description: Action flows logically between scenes.
        weight: 10
        critical: true
      - id: E3
        name: Lighting Consistency
        description: Light direction/intensity remains constant.
        weight: 10
        critical: false
      - id: E4
        name: Camera Intent
        description: Camera angles match instructions.
        weight: 10
        critical: false
      - id: E5
        name: Color Palette
        description: Colors match the requested mood.
        weight: 10
        critical: false
      - id: E6
        name: Prop Continuity
        description: Key props remain unchanged.
        weight: 10
        critical: true
      - id: E7
        name: Facial Expression
        description: Expressions match requested emotion.
        weight: 10
        critical: false
      - id: E8
        name: Background Stability
        description: Static backgrounds do not shift.
        weight: 10
        critical: true

  - key: educational
    name: Educational & Informative
    focus: Accuracy and clarity. Semantic Fidelity is critical here.
    criteria:
      - id: ED1
        name: Step Order
        description: Steps shown in correct sequence.
        weight: 15
        critical: true
      - id: ED2
        name: Text Legibility
        description: Text is sharp, correct, and unobstructed.
        weight: 15
        critical: true
      - id: ED3
        name: Visual Accuracy
        description: Visuals match factual reality (e.g. correct anatomy, history).
        weight: 15
        critical: true
      - id: ED4
        name: Focus Clarity
        description: Main subject is centered and unobstructed.
        weight: 10
        critical: false
      - id: ED5
        name: Diagram Integrity
        description: Lines straight, shapes closed, labels correct.
        weight: 10
        critical: false
      - id: ED6
        name: Pacing
        description: Duration sufficient to absorb detail.
        weight: 10
        critical: false
      - id: ED7
        name: Contrast
        description: Text/visuals readable against background.
        weight: 5
        critical: false
      - id: ED8
        name: No Distractors
        description: No irrelevant elements.
        weight: 10
        critical: false

  - key: marketing
    name: Marketing & Business
    focus: Brand fidelity and product visibility.
    criteria:
      - id: M1
        name: Logo Accuracy
        description: Logo present, correct shape/color.
        weight: 15
        critical: true
      - id: M2
        name: Product Visibility
        description: Product clearly visible/unobstructed.
        weight: 15
        critical: true
      - id: M3
        name: Brand Color Match
        description: Colors match brand hex codes.
        weight: 10
        critical: false
      - id: M4
        name: CTA Presence
        description: CTA visible in final scene.
        weight: 10
        critical: false
      - id: M5
        name: Model Consistency
        description: Model appearance consistent.
        weight: 10
        critical: false
      - id: M6
        name: Aspect Ratio
        description: Correct for platform.
        weight: 10
        critical: true
      - id: M7
        name: Lighting Quality
        description: No harsh shadows/blown highlights.
        weight: 5
        critical: false
      - id: M8
        name: Text Accuracy
        description: Promotional text correct.
        weight: 5
        critical: false

  - key: social_media
    name: Social Media & Short-Form
    focus: Structure and emotional trigger.
    criteria:
      - id: SM1
        name: Hook (0-3s)
        description: Visual change/text in first 3s.
        weight: 10
        critical: true
      - id: SM2
        name: Context (3-8s)
        description: Shows "before" state/problem.
        weight: 10
        critical: false
      - id: SM3
        name: Tension (8-15s)
        description: Shows frustration/consequence.
        weight: 10
        critical: false
      - id: SM4
        name: Reveal (15-22s)
        description: Product/Solution clearly shown.
        weight: 10
        critical: true
      - id: SM5
        name: CTA (22-28s)
        description: CTA visible in final 6s.
        weight: 10
        critical: true
      - id: SM6
        name: Pacing
        description: Avg shot duration < 3s.
        weight: 10
        critical: false
      - id: SM7
        name: Trigger Fidelity
        description: Visuals match intended emotional trigger (Curiosity/FOMO/etc.).
        weight: 10
        critical: true
      - id: SM8
        name: Aspect Ratio
        description: 9:16 vertical, no black bars.
        weight: 10
        critical: true

  - key: gaming
    name: Gaming & Interactive
    focus: UI fidelity and gameplay accuracy.
    criteria:
      - id: G1
        name: UI Integrity
        description: HUD elements present/correct.
        weight: 15
        critical: true
      - id: G2
        name: Game Asset Accuracy
        description: Matches game's visual style.
        weight: 15
        critical: true
      - id: G3
        name: Action Clarity
        description: Player action visible/unobstructed.
        weight: 10
        critical: false
      - id: G4
        name: Score/Status Display
        description: Legible and updates correctly.
        weight: 10
        critical: false
      - id: G5
        name: Camera Angle
        description: Matches requested perspective.
        weight: 10
        critical: false
      - id: G6
        name: Effect Accuracy
        description: VFX match game style.
        weight: 10
        critical: false
      - id: G7
        name: No Glitches
        description: No clipping through walls.
        weight: 5
        critical: false
      - id: G8
        name: Highlight Relevance
        description: Key moment featured.
        weight: 5
        critical: false

  - key: event
    name: Event & Live Coverage
    focus: Multi-angle realism and key moments.
    criteria:
      - id: EV1
        name: Key Moment Inclusion
        description: Specific event visually present.
        weight: 15
        critical: true
      - id: EV2
        name: Multi-Angle
        description: At least 2 camera angles shown.
        weight: 15
        critical: true
      - id: EV3
        name: Crowd/Context
        description: Background includes appropriate context.
        weight: 10
        critical: false
      - id: EV4
        name: Audio-Visual Match
        description: Audio matches visual action.
        weight: 10
        critical: false
      - id: EV5
        name: Stability
        description: Camera stable (unless handheld requested).
        weight: 10
        critical: false
      - id: EV6
        name: Lighting
        description: Consistent with venue.
        weight: 10
        critical: false
      - id: EV7
        name: Continuity
        description: Cuts do not cause action jumps.
        weight: 5
        critical: false
      - id: EV8
        name: Resolution
        description: High-res enough to see details.
        weight: 5
        critical: false
