# @package _global_
#
# One real seed against the live model, with a stand-in generation tool.
#
# This asks the cheap half of the question: can the agent drive generate_video
# correctly — right mode, a full brief in the prompt, submit_video afterwards —
# without spending GPU minutes on a video whose quality is not what is being
# tested here. Use `video_backend=wangp` for the real thing.
#
# The budget is deliberately short. With the tool returning instantly, an agent
# that knows what to do finishes in a couple of minutes; anything longer means
# it is lost, and waiting an hour to learn that is a waste.

defaults:
  - override /generator: pi
  - override /video_backend: fake
  - override /judge: pi

generator:
  timeout_seconds: 600
  exit_grace_seconds: 10
  heartbeat_seconds: 30

run:
  category: marketing
  max_seeds: 1
