# @package generator
#
# The agentic generator: one pi run per seed, in an isolated workspace.
# `model`, `system_prompt`, `skills` and `tools` are filled by their own groups.

kind: pi
pi_bin: pi
offline: true

# Custom-tool extensions (.ts). The handoff tool is always loaded on top of these.
extensions: []
discover_extensions: false

context_files: false
prompt_templates: false
approve_project: false

# Timing. There is deliberately no inactivity timeout anywhere: pi puts no default
# timeout on bash, so a legitimate generation may block silently for many minutes.
timeout_seconds: 3600 # hard per-seed budget
exit_grace_seconds: 15 # how long to let pi exit itself after submit_video
heartbeat_seconds: 60 # progress logging while the agent works

env: {}
copy_files: []
extra_args: []
