# @package generator
#
# A stand-in generate_video with the same name, parameters and result shape as
# the real one, returning a fixed video immediately.
#
# This separates the cheap question from the expensive one. Whether the agent
# drives the tool correctly — right mode, a full brief in the prompt, submitting
# afterwards — is answerable in seconds without a GPU. Only whether the video is
# any good needs the real backend.

extension_tools:
  - generate_video

extensions:
  - ${veb_ext:fake_video_tools.ts}

env:
  VEB_FAKE_VIDEO_DELAY: "0" # seconds to stall, to exercise long-wait handling

sandbox:
  # fake_video_tools.ts resolves its stand-in clip relative to its own file, so
  # mounting the .ts alone leaves it with nothing to return. Scoped to this arm
  # rather than mounted always, because the clip is also a live shortcut past the
  # whole benchmark: copy it to $VEB_OUTPUT_PATH, submit, and score without
  # generating anything (runs/FINDINGS.md §4). It has no business being reachable
  # from a run that is supposed to produce a real video.
  extra_mounts:
    - ${veb_ext:assets}:/opt/veb/ext/assets:ro
